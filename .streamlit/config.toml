[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#FBFBFA"
secondaryBackgroundColor = "#F4F3F0"
textColor = "#2F3437"
linkColor = "#1F6C9F"
borderColor = "#E6E5E1"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "6px"
baseFontSize = 16
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
headingFontWeights = 500
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"

[client]
toolbarMode = "minimal"
